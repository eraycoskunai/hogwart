<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hogwarts: Mühürlü Kule</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/ui/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>

  <div id="hud" class="hidden"></div>
  <div id="menu"></div>
  <div id="debug"></div>
  <div id="gallery"></div>
  <div id="creator"></div>

  <div id="loading" aria-live="polite">
    <div class="boot-card parchment">
      <p class="loading-title"></p>
      <div class="boot-progress loading-bar"><i></i></div>
      <p class="boot-status loading-status"></p>
    </div>
  </div>

  <div id="boot">
    <div class="boot-card parchment">
      <div class="boot-crest" aria-hidden="true"></div>
      <h1>Hogwarts</h1>
      <h2>Mühürlü Kule</h2>
      <p class="boot-phase">Faz 6 · Şato içi, hareketli merdivenler, konuşan portreler ve hayaletler</p>
      <div class="boot-progress"><i></i></div>
      <p class="boot-status">Yükleniyor…</p>
      <div class="boot-buttons">
        <button class="primary" data-boot="new">Yeni Oyun</button>
        <button data-boot="continue" hidden>Devam Et</button>
        <button data-boot="gallery">Malzeme Galerisi</button>
      </div>
      <p class="boot-hint">WASD hareket · Fare kamera · Boşluk zıpla · Shift depar · C çömel · Sağ tık nişan · Tab kilitlen · E etkileşim · H kontroller · F3 hata ayıklama</p>
    </div>
  </div>

  <noscript>Bu oyun JavaScript gerektirir.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
